name: Deploy to Local Docker

on:
  workflow_run:
    workflows: ["Product CD Docker Hub"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Deploy to local Docker Engine
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Check containers
        run: docker compose -f docker-compose-prod.yaml ps

      - name: Verify API health
        run: |
          for /L %%i in (1,1,10) do (
            curl.exe --fail --silent http://localhost:5000/health && exit /b 0
            echo API not ready - retry %%i/10
            ping 127.0.0.1 -n 4 > nul
          )
          docker compose -f docker-compose-prod.yaml ps
          docker logs product_api_prod
          exit /b 1
