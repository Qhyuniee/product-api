name: Product CD Docker Hub

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest .

      - name: Run container for healthcheck
        run: |
          docker network create product-ci-network

          docker run -d \
            --name mongodb-ci \
            --network product-ci-network \
            mongo:6.0

          docker run -d \
            --name product-api-ci \
            --network product-ci-network \
            -p 5000:5000 \
            -e PORT=5000 \
            -e MONGO_URI=mongodb://mongodb-ci:27017/productdb \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest

          for i in {1..15}; do
            if curl -f http://localhost:5000/health; then
              exit 0
            fi
            sleep 3
          done

          docker logs product-api-ci
          exit 1

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
