version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb_prod
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  product-api:
    image: qhyuniee/product-api:latest
    container_name: product_api_prod
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://root:example@mongodb:27017/productdb?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_prod_data:
